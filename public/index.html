<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FutStats | Inteligência Neural</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
        /* --- CONFIGURAÇÕES GERAIS --- */
        :root {
            --bg: #050505;
            --panel: #0a0a0a;
            --border: #1a1a1a;
            --accent: #2563eb;
            --text-main: #f0f0f0;
            --text-dim: #888;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- HEADER --- */
        header { 
            background: rgba(0,0,0,0.95); 
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); 
            padding: 12px 5%; 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
        }

        .header-content { 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            max-width: 1400px; 
            margin: 0 auto; 
        }

        .brand-container { 
            display: flex; 
            align-items: center; 
            text-decoration: none; 
            color: white; 
            gap: 10px; 
        }

        .site-logo-img { width: 32px; height: 32px; object-fit: contain; }
        .logo { font-weight: 900; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        /* NAV LINKS - Desktop */
        .nav-links {
            display: flex;
            gap: 15px;
        }

        .nav-links a { 
            color: var(--text-dim); 
            text-decoration: none; 
            font-size: 0.7rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            transition: 0.3s; 
        }

        .btn-download { 
            background: #fff; 
            color: #000; 
            border: none; 
            padding: 8px 16px; 
            font-weight: 900; 
            font-size: 0.65rem; 
            border-radius: 4px; 
            cursor: pointer; 
            text-transform: uppercase;
        }

        /* --- IA NEURAL INSIGHTS --- */
        #ia-insights-container { padding: 15px 5%; background: #080808; border-bottom: 1px solid var(--border); }
        .ia-wrapper { display: flex; align-items: center; gap: 15px; max-width: 1200px; margin: 0 auto; }
        .ia-icon-box { position: relative; display: flex; align-items: center; justify-content: center; width: 45px; height: 45px; background: #111; border-radius: 50%; border: 1px solid #222; flex-shrink: 0; }
        .ia-status-pulse { position: absolute; width: 100%; height: 100%; border: 2px solid var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(0.8); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }
        .ia-robot-icon { font-size: 1.2rem; }
        .ia-label { font-size: 0.55rem; color: var(--accent); font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        #ia-output { font-size: 0.8rem; color: #ccc; margin-top: 2px; line-height: 1.3; }

        /* --- CARROSSEL --- */
        .hero-carousel { position: relative; width: 100%; height: 75vh; min-height: 450px; overflow: hidden; }
        .carousel-slides { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1); }
        .slide { min-width: 100%; height: 100%; position: relative; }
        .slide img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }
        
        .slide-overlay { 
            position: absolute; 
            bottom: 15%; 
            left: 5%; 
            right: 5%;
            max-width: 600px; 
            opacity: 0; 
            transform: translateY(20px); 
            transition: 0.8s 0.2s; 
        }
        .slide.active .slide-overlay { opacity: 1; transform: translateY(0); }
        
        .news-category { background: var(--accent); color: white; padding: 4px 10px; font-size: 0.6rem; font-weight: 900; text-transform: uppercase; border-radius: 3px; }
        .news-title { font-size: clamp(1.8rem, 8vw, 2.8rem); font-weight: 900; margin: 12px 0; line-height: 1.1; }
        .news-description { font-size: 0.95rem; color: #bbb; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .btn-saiba-mais { background: transparent; border: 2px solid #fff; color: #fff; padding: 10px 25px; font-weight: 900; font-size: 0.8rem; cursor: pointer; }

        .carousel-controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 15px; z-index: 10; }
        .control-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
        .dot { width: 6px; height: 6px; background: rgba(255,255,255,0.3); border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .dot.active { background: #fff; width: 20px; border-radius: 10px; }

        /* --- MOBILE NAV (MENU HAMBURGUER SIMPLES) --- */
        @media (max-width: 768px) {
            .nav-links { display: none; } /* Esconde links de texto em telas pequenas */
            .header-content { justify-content: space-between; }
            .hero-carousel { height: 70vh; }
            .ia-wrapper { flex-direction: row; }
            #ia-output { font-size: 0.75rem; }
            
            /* Ajuste footer */
            .footer-grid { grid-template-columns: 1fr; text-align: center; gap: 30px; }
        }

        /* --- PAINEL DETALHES --- */
        #news-details-panel { display: none; padding: 40px 5%; background: #0a0a0a; border-top: 1px solid var(--border); }
    </style>
</head>
<body id="home-page">

    <header>
        <div class="header-content">
            <a href="index.html" class="brand-container">
                <img src="logos/logo.png" alt="FS" class="site-logo-img" onerror="this.src='https://cdn-icons-png.flaticon.com/512/53/53244.png'">
                <h1 class="logo">FutStats</h1>
            </a>
            
            <nav class="nav-links">
                <a href="classificacao.html">Tabelas</a>
                <a href="arena.html">Arena</a>
                <a href="aovivo.html">Ao Vivo</a>
                <a href="paulistao.html">Paulistão</a>
            </nav>

            <div class="nav-right">
                <button class="btn-download">APP</button>
            </div>
        </div>
    </header>

    <section id="ia-insights-container">
        <div class="ia-wrapper">
            <div class="ia-icon-box">
                <span class="ia-status-pulse"></span>
                <span class="ia-robot-icon">🤖</span>
            </div>
            <div class="ia-text-content">
                <span class="ia-label">Neural Insight:</span>
                <p id="ia-output">Carregando análise...</p>
            </div>
        </div>
    </section>

    <main>
        <section class="hero-carousel">
            <div class="carousel-slides" id="carousel-slides"></div>
            <div class="carousel-controls">
                <button class="control-btn" id="prev-slide">&lt;</button>
                <div class="carousel-dots" id="carousel-dots"></div>
                <button class="control-btn" id="next-slide">&gt;</button>
            </div>
        </section>

        <section id="news-details-panel">
            <h3 id="details-title" style="color: #fff; margin-bottom: 15px; font-weight: 800; font-size: 1.3rem;"></h3>
            <p id="details-content" style="color: #aaa; line-height: 1.6; font-size: 0.9rem;"></p>
            <button onclick="document.getElementById('news-details-panel').style.display='none'" style="margin-top: 20px; background: var(--accent); color: white; border: none; padding: 10px 20px; cursor: pointer; font-size: 0.7rem; font-weight: bold;">FECHAR</button>
        </section>
    </main>

    <footer>
        <div class="footer-grid">
            <div>
                <h4 style="color: #fff; font-size: 0.7rem; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase;">FUTSTATS</h4>
                <p style="color: #666; font-size: 0.7rem; line-height: 1.8;">Vanguarda da análise esportiva com tecnologia neural.</p>
            </div>
            <div style="display: flex; justify-content: center; gap: 20px;">
                <a href="classificacao.html" style="color: #888; text-decoration: none; font-size: 0.7rem;">Tabelas</a>
                <a href="arena.html" style="color: #888; text-decoration: none; font-size: 0.7rem;">Arena</a>
                <a href="aovivo.html" style="color: #888; text-decoration: none; font-size: 0.7rem;">Ao Vivo</a>
            </div>
        </div>
        <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #111; text-align: center; color: #444; font-size: 0.55rem;">
            © 2026 FUTSTATS NEURAL TECHNOLOGY.
        </div>
    </footer>

    <script>
        // Supabase Init (Mantido seu código original)
        const SUPABASE_URL = "https://sihunefyfkecumbiyxva.supabase.co"; 
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNpaHVuZWZ5ZmtlY3VtYml5eHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY0MDg5MzgsImV4cCI6MjA4MTk4NDkzOH0.qgjbdCe1hfzcuglS6AAj6Ua0t45C2GOKH4r3JCpRn_A";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const noticiasCarrossel = [
            { id: 1, img: 'img/carrossel1.webp', categoria: 'IA', titulo: 'O Futuro é Dados', descricao: 'Processamos 10.000 variáveis para sua melhor análise.', detalhes: 'Modelos de regressão avançados para prever o domínio de campo.' },
            { id: 2, img: 'img/carrossel2.webp', categoria: 'H2H', titulo: 'Duelos Lendários', descricao: 'Compare gigantes com precisão científica.', detalhes: 'Análise de xG, posse e solidez defensiva.' },
            { id: 3, img: 'img/carrossel3.webp', categoria: 'Live', titulo: 'Feeds Refinados', descricao: 'Acompanhe o tempo real com gráficos de pressão.', detalhes: 'Latência reduzida e estatísticas em tempo real.' },
            { id: 4, img: 'img/carrossel4.webp', categoria: '2026', titulo: 'Paulistão 2026', descricao: 'Tabela e jogos do Campeonato Paulista.', detalhes: 'Acompanhe seu time na liga mais antiga do Brasil.' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            carregarIA();
            inicializarCarrossel();
        });

        async function carregarIA() {
            const output = document.getElementById('ia-output');
            try {
                const { data, error } = await _supabase.from('site_info').select('comentario_ia').eq('id', 1).single();
                if (data) output.innerText = data.comentario_ia;
            } catch (e) { output.innerText = "Sincronizando dados neurais..."; }
        }

        function inicializarCarrossel() {
            const slidesContainer = document.getElementById('carousel-slides');
            const dotsContainer = document.getElementById('carousel-dots');
            
            slidesContainer.innerHTML = noticiasCarrossel.map((n, i) => `
                <div class="slide ${i === 0 ? 'active' : ''}">
                    <img src="${n.img}" onerror="this.src='https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=1000&auto=format&fit=crop'">
                    <div class="slide-overlay">
                        <span class="news-category">${n.categoria}</span>
                        <h2 class="news-title">${n.titulo}</h2>
                        <p class="news-description">${n.descricao}</p>
                        <button class="btn-saiba-mais" onclick="mostrarDetalhesNoticia(${n.id})">SAIBA MAIS</button>
                    </div>
                </div>
            `).join('');

            dotsContainer.innerHTML = noticiasCarrossel.map((_, i) => `<span class="dot ${i === 0 ? 'active' : ''}" data-index="${i}"></span>`).join('');

            let current = 0;
            const dots = document.querySelectorAll('.dot');
            const slides = document.querySelectorAll('.slide');

            function update() {
                slidesContainer.style.transform = `translateX(-${current * 100}%)`;
                dots.forEach(d => d.classList.remove('active'));
                dots[current].classList.add('active');
                slides.forEach(s => s.classList.remove('active'));
                slides[current].classList.add('active');
            }

            document.getElementById('next-slide').onclick = () => { current = (current + 1) % noticiasCarrossel.length; update(); };
            document.getElementById('prev-slide').onclick = () => { current = (current - 1 + noticiasCarrossel.length) % noticiasCarrossel.length; update(); };
            dots.forEach(d => d.onclick = (e) => { current = parseInt(e.target.dataset.index); update(); });

            setInterval(() => { current = (current + 1) % noticiasCarrossel.length; update(); }, 7000);
        }

        function mostrarDetalhesNoticia(id) {
            const n = noticiasCarrossel.find(x => x.id === id);
            document.getElementById('details-title').innerText = n.titulo;
            document.getElementById('details-content').innerText = n.detalhes;
            document.getElementById('news-details-panel').style.display = 'block';
            window.scrollTo({ top: document.getElementById('news-details-panel').offsetTop - 100, behavior: 'smooth' });
        }
    </script>
</body>
</html>
